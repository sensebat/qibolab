# Offline tests of the Zurich Instruments driver: LabOne Q emulation only, no hardware.
#
# Three rows, same tests (tests/instruments/zi of the driver + the conformance suite of
# orkun/ci), each installed from its own uv.lock:
#   pinned       upstream ElStabilini/qibolab@zi_drivers (laboneq 26.4). Must be green.
#   26.10        this fork's orkun/26.10 (laboneq 26.10).
#   merge-trial  upstream zi_drivers merged into orkun/26.10. Informational.
# A last job builds one HTML report (artifact "test-report").
name: zi-driver

on:
  push:
    branches: [orkun/ci, orkun/26.10]
  # schedule and the Run-workflow button work only from the default branch (orkun/ci).
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  UPSTREAM_REPO: ElStabilini/qibolab
  UPSTREAM_REF: zi_drivers
  OURS_REF: orkun/26.10
  SUITE_REF: orkun/ci

jobs:
  test:
    name: ${{ matrix.row }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: ${{ matrix.row == 'merge-trial' }}
    strategy:
      fail-fast: false
      matrix:
        # A push to orkun/26.10 tests only that commit.
        row: ${{ fromJSON(github.event_name == 'push' && github.ref_name == 'orkun/26.10' && '["26.10"]' || '["pinned", "26.10", "merge-trial"]') }}
    steps:
      - name: Choose the driver for this row
        env:
          ROW: ${{ matrix.row }}
        run: |
          case "$ROW" in
            pinned)
              repo=$UPSTREAM_REPO; ref=$UPSTREAM_REF ;;
            26.10)
              repo=$GITHUB_REPOSITORY; ref=$OURS_REF
              if [ "$GITHUB_EVENT_NAME" = push ] && [ "$GITHUB_REF_NAME" = "$OURS_REF" ]; then
                ref=$GITHUB_SHA
              fi ;;
            merge-trial)
              repo=$GITHUB_REPOSITORY; ref=$OURS_REF
              echo "MERGE_URL=https://github.com/$UPSTREAM_REPO" >> "$GITHUB_ENV"
              echo "MERGE_REF=$UPSTREAM_REF" >> "$GITHUB_ENV" ;;
          esac
          # The suite of this commit when it is on orkun/ci, else the head of orkun/ci.
          suite=$SUITE_REF
          if [ "$GITHUB_REF_NAME" = "$SUITE_REF" ]; then suite=$GITHUB_SHA; fi
          {
            echo "ROW=$ROW"
            echo "DRIVER_REPO=$repo"
            echo "DRIVER_REF=$ref"
            echo "SUITE=$suite"
          } >> "$GITHUB_ENV"

      - name: Check out the driver ${{ env.DRIVER_REPO }}@${{ env.DRIVER_REF }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.DRIVER_REPO }}
          ref: ${{ env.DRIVER_REF }}
          path: driver
          # The merge needs history.
          fetch-depth: ${{ matrix.row == 'merge-trial' && '0' || '1' }}
          persist-credentials: false

      - name: Check out the conformance suite and ci scripts (orkun/ci)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SUITE }}
          path: suite
          persist-credentials: false

      - name: Install uv and Python 3.13
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.13"
          cache-dependency-glob: driver/uv.lock

      - name: Merge, install from the driver's uv.lock, test
        run: bash suite/ci/run_row.sh driver suite "row-$ROW"

      - name: Upload the row results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: row-${{ matrix.row }}
          path: row-${{ matrix.row }}/
          if-no-files-found: warn

  report:
    needs: test
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the report script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: ci
          persist-credentials: false

      - name: Download the row results
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: row-*
          path: rows

      - name: Build the HTML report
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          mkdir -p rows
          python3 ci/report.py rows report/index.html --summary "$GITHUB_STEP_SUMMARY" \
            --run-url "$RUN_URL" --when "$(date -u '+%Y-%m-%d %H:%M UTC')"

      - name: Upload the HTML report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-report
          path: report/index.html
