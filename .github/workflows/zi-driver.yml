# Offline tests of the Zurich Instruments driver: LabOne Q emulation only, no hardware.
#
# A 2x2 of code (rows) and environment (columns):
#   R1  ElStabilini/qibolab@zi_drivers, newest commit
#   R2  sensebat/qibolab@orkun/26.10 with ElStabilini/qibolab@zi_drivers merged for this run
#       only (nothing pushed); a merge conflict is reported with the files
#   C1  laboneq pinned: the version in the uv.lock of ElStabilini/qibolab@zi_drivers
#   C2  laboneq latest: the newest laboneq on PyPI
# Each cell installs the row's uv.lock, replaces laboneq by the column's version (zhinst-*
# follow, every other package as locked) and runs tests/instruments/zi plus the conformance
# suite of sensebat/qibolab@orkun/ci. A cell is red when a test fails.
#
# Triggers:
#   schedule (every 30 min)  runs only when the key (R1, R2, orkun/ci commits + newest
#                            laboneq) differs from the published state.json
#   workflow_dispatch        always runs (only_if_changed: behave like the schedule)
#   push to orkun/ci         always runs
#   push to orkun/26.10      only the R2 cells for that commit; no Pages
# Runs on orkun/ci publish index.html and state.json at https://sensebat.github.io/qibolab/.
name: zi-driver

on:
  push:
    branches: [orkun/ci, orkun/26.10]
  # schedule and the Run-workflow button work only from the default branch (orkun/ci).
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      only_if_changed:
        description: Skip when commits and newest laboneq are unchanged (as the schedule does)
        type: boolean
        default: false

permissions:
  contents: read

# One run per branch at a time; a newer pending run replaces an older pending one.
concurrency:
  group: zi-driver-${{ github.ref }}
  cancel-in-progress: false

env:
  R1_REPO: ElStabilini/qibolab
  R1_REF: zi_drivers
  R2_REPO: sensebat/qibolab
  R2_REF: orkun/26.10
  SUITE_REPO: sensebat/qibolab
  SUITE_REF: orkun/ci
  STATE_URL: https://sensebat.github.io/qibolab/state.json

jobs:
  changes:
    name: Commits, laboneq versions, run or skip
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.decide.outputs.run }}
      key: ${{ steps.decide.outputs.key }}
      r1_sha: ${{ steps.decide.outputs.r1_sha }}
      r2_sha: ${{ steps.decide.outputs.r2_sha }}
      ci_sha: ${{ steps.decide.outputs.ci_sha }}
      pinned: ${{ steps.decide.outputs.pinned }}
      latest: ${{ steps.decide.outputs.latest }}
      matrix: ${{ steps.decide.outputs.matrix }}
    steps:
      - name: Check out the ci scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: ci
          persist-credentials: false

      - name: Resolve and decide
        id: decide
        env:
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          ONLY_IF_CHANGED: ${{ inputs.only_if_changed || false }}
        run: bash ci/changes.sh

  cell:
    name: ${{ matrix.name }}
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.matrix) }}
    env:
      ROW: ${{ matrix.row }}
      COL: ${{ matrix.col }}
      R1_SHA: ${{ needs.changes.outputs.r1_sha }}
      LABONEQ_PINNED: ${{ needs.changes.outputs.pinned }}
      LABONEQ_LATEST: ${{ needs.changes.outputs.latest }}
    steps:
      - name: Check out the row's code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ matrix.row == 'r1' && env.R1_REPO || env.R2_REPO }}
          ref: ${{ matrix.row == 'r1' && needs.changes.outputs.r1_sha || needs.changes.outputs.r2_sha }}
          path: driver
          # The R2 merge needs history.
          fetch-depth: ${{ matrix.row == 'r2' && '0' || '1' }}
          persist-credentials: false

      - name: Check out the conformance suite and ci scripts (orkun/ci)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.changes.outputs.ci_sha }}
          path: suite
          persist-credentials: false

      - name: Install uv and Python 3.13
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.13"
          cache-dependency-glob: driver/uv.lock

      - name: Merge (R2), install, set laboneq, test
        run: bash suite/ci/run_cell.sh driver suite "cell-$ROW-$COL"

      - name: Upload the cell results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cell-${{ matrix.cell }}
          path: cell-${{ matrix.cell }}/
          if-no-files-found: warn

  report:
    name: Report
    needs: [changes, cell]
    if: always() && needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the report script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: ci
          persist-credentials: false

      - name: Download the cell results
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: cell-*
          path: cells

      - name: Build index.html and state.json
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          KEY: ${{ needs.changes.outputs.key }}
          R1_SHA: ${{ needs.changes.outputs.r1_sha }}
          R2_SHA: ${{ needs.changes.outputs.r2_sha }}
          CI_SHA: ${{ needs.changes.outputs.ci_sha }}
          LABONEQ_PINNED: ${{ needs.changes.outputs.pinned }}
          LABONEQ_LATEST: ${{ needs.changes.outputs.latest }}
          MATRIX: ${{ needs.changes.outputs.matrix }}
        run: |
          mkdir -p cells
          python3 ci/report.py cells report --summary "$GITHUB_STEP_SUMMARY" \
            --when "$(date -u '+%Y-%m-%d %H:%M UTC')"

      - name: Upload the report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-report
          path: report/

  # Publish at https://sensebat.github.io/qibolab/ (orkun/ci only), also when a cell is red.
  pages:
    name: Publish to GitHub Pages
    needs: report
    if: always() && needs.report.result == 'success' && github.ref == 'refs/heads/orkun/ci'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Download the report
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: test-report
          path: site

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload the Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
