# Offline tests of the Zurich Instruments driver: LabOne Q emulation only, no hardware.
#
# Same tests in every row (tests/instruments/zi of the driver + the conformance suite of
# orkun/ci), each row installed from its own uv.lock. Runs on orkun/ci have two rows:
#   today    "zi_drivers on 26.4 (rack today)": upstream ElStabilini/qibolab@zi_drivers,
#            laboneq 26.4. Must be green.
#   upgrade  "zi_drivers on 26.10 (after upgrade)": upstream zi_drivers merged into
#            orkun/26.10, laboneq 26.10. Informational; a merge conflict is reported.
# A push to orkun/26.10 has one row:
#   branch   "orkun/26.10 branch": that commit alone, laboneq 26.10.
# A last job builds one HTML report (artifact "test-report"); on orkun/ci the "pages" job
# publishes it at https://sensebat.github.io/qibolab/.
name: zi-driver

on:
  push:
    branches: [orkun/ci, orkun/26.10]
  # schedule and the Run-workflow button work only from the default branch (orkun/ci).
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  UPSTREAM_REPO: ElStabilini/qibolab
  UPSTREAM_REF: zi_drivers
  OURS_REF: orkun/26.10
  SUITE_REF: orkun/ci

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: ${{ matrix.row == 'upgrade' }}
    strategy:
      fail-fast: false
      matrix:
        # A push to orkun/26.10 tests only that commit; every other run tests the two rows.
        include: ${{ fromJSON(github.event_name == 'push' && github.ref_name == 'orkun/26.10' && '[{"row":"branch","name":"orkun/26.10 branch"}]' || '[{"row":"today","name":"zi_drivers on 26.4 (rack today)"},{"row":"upgrade","name":"zi_drivers on 26.10 (after upgrade)"}]') }}
    steps:
      - name: Choose the driver for this row
        env:
          ROW: ${{ matrix.row }}
          ROW_NAME: ${{ matrix.name }}
        run: |
          case "$ROW" in
            today)
              repo=$UPSTREAM_REPO; ref=$UPSTREAM_REF ;;
            branch)
              repo=$GITHUB_REPOSITORY; ref=$OURS_REF
              if [ "$GITHUB_EVENT_NAME" = push ] && [ "$GITHUB_REF_NAME" = "$OURS_REF" ]; then
                ref=$GITHUB_SHA
              fi ;;
            upgrade)
              repo=$GITHUB_REPOSITORY; ref=$OURS_REF
              echo "MERGE_URL=https://github.com/$UPSTREAM_REPO" >> "$GITHUB_ENV"
              echo "MERGE_REF=$UPSTREAM_REF" >> "$GITHUB_ENV" ;;
          esac
          # The suite of this commit when it is on orkun/ci, else the head of orkun/ci.
          suite=$SUITE_REF
          if [ "$GITHUB_REF_NAME" = "$SUITE_REF" ]; then suite=$GITHUB_SHA; fi
          {
            echo "ROW=$ROW"
            echo "ROW_NAME=$ROW_NAME"
            echo "DRIVER_REPO=$repo"
            echo "DRIVER_REF=$ref"
            echo "SUITE=$suite"
          } >> "$GITHUB_ENV"

      - name: Check out the driver ${{ env.DRIVER_REPO }}@${{ env.DRIVER_REF }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.DRIVER_REPO }}
          ref: ${{ env.DRIVER_REF }}
          path: driver
          # The merge needs history.
          fetch-depth: ${{ matrix.row == 'upgrade' && '0' || '1' }}
          persist-credentials: false

      - name: Check out the conformance suite and ci scripts (orkun/ci)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SUITE }}
          path: suite
          persist-credentials: false

      - name: Install uv and Python 3.13
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.13"
          cache-dependency-glob: driver/uv.lock

      - name: Merge, install from the driver's uv.lock, test
        run: bash suite/ci/run_row.sh driver suite "row-$ROW"

      - name: Upload the row results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: row-${{ matrix.row }}
          path: row-${{ matrix.row }}/
          if-no-files-found: warn

  report:
    needs: test
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the report script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: ci
          persist-credentials: false

      - name: Download the row results
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: row-*
          path: rows

      - name: Build the HTML report
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          mkdir -p rows
          python3 ci/report.py rows report/index.html --summary "$GITHUB_STEP_SUMMARY" \
            --run-url "$RUN_URL" --when "$(date -u '+%Y-%m-%d %H:%M UTC')"

      - name: Upload the HTML report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-report
          path: report/index.html

  # Publish the report at https://sensebat.github.io/qibolab/ (default branch only).
  # Runs even when a row is red; skipped when the report itself was not built.
  pages:
    needs: report
    if: >-
      always() && needs.report.result == 'success' && github.ref == 'refs/heads/orkun/ci'
      && contains(fromJSON('["schedule", "workflow_dispatch", "push"]'), github.event_name)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Download the HTML report
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: test-report
          path: site

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload the Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
