# Offline tests of the Zurich Instruments driver: LabOne Q emulation only, no hardware.
# ci/README.md explains the page, the rows and columns, and how to run one cell locally.
#
# A 2x2 of code (rows) and environment (columns):
#   R1  ElStabilini/qibolab@zi_drivers, newest commit
#   R2  sensebat/qibolab@orkun/26.10 with ElStabilini/qibolab@zi_drivers merged for this run
#       only (nothing pushed); a merge conflict is reported with the files
#   C1  laboneq pinned: the version in the uv.lock of ElStabilini/qibolab@zi_drivers
#   C2  laboneq latest: the newest laboneq on PyPI
# Targets (must be green): R1 x pinned and R2 x latest. R1 x latest and R2 x pinned are
# information: red there is shown but does not fail the run or the commit status. The gate
# job decides the run.
# Test results: job "checks" publishes one check per cell, "ZI tests <cell> (<role>)", with
# the failed tests as annotations (EnricoMi/publish-unit-test-result-action). A target check
# fails on a failed test; an information check is set to neutral instead (grey, not red).
# An extra row X (no merge) runs an orkun/proto-* branch or the extra_ref dispatch input.
# Each cell installs the row's uv.lock, replaces laboneq by the column's version (zhinst-*
# follow, every other package as locked) and runs tests/instruments/zi plus the conformance
# suite of sensebat/qibolab@orkun/ci. A cell is red when a test fails.
#
# Triggers:
#   schedule (:17 and :47)       runs only when the key (R1, R2, orkun/ci commits + newest
#                                laboneq) differs from the published state.json; GitHub fires
#                                it rarely here (ci/README.md), see zi-check below
#   repository_dispatch zi-check same check as the schedule, on the default branch
#   workflow_dispatch            always runs (only_if_changed: behave like the schedule;
#                                extra_ref: add that ref as row X)
#   push to orkun/ci             always runs
#   push to orkun/26.10          only the R2 cells for that commit; no Pages
#   push to orkun/proto-*        R1, R2 and the branch as row X; no Pages
#   pull_request to orkun/26.10  the R2 cells for the pull request's head (e.g. a Dependabot
#                                laboneq bump, .github/dependabot.yml); no Pages. The workflow
#                                file comes from the pull request's merge commit, so this
#                                needs orkun/26.10 to have merged this file.
# Pages (https://sensebat.github.io/qibolab/, index.html + state.json) are published only by
# runs on orkun/ci with rows R1 and R2 and no extra row.
name: zi-driver

on:
  push:
    branches: [orkun/ci, orkun/26.10, "orkun/proto-*"]
  pull_request:
    branches: [orkun/26.10]
  # schedule, repository_dispatch and the Run-workflow button use the default branch (orkun/ci).
  schedule:
    # Off the full and half hour: "High load times include the start of every hour. If the load
    # is sufficiently high enough, some queued jobs may be dropped. To decrease the chance of
    # delay, schedule your workflow to run at a different time of the hour."
    # https://docs.github.com/en/actions/reference/workflows-and-actions/events-that-trigger-workflows#schedule
    - cron: "17,47 * * * *"
  repository_dispatch:
    types: [zi-check]
  workflow_dispatch:
    inputs:
      only_if_changed:
        description: Skip when commits and newest laboneq are unchanged (as the schedule does)
        type: boolean
        default: false
      extra_ref:
        description: Also run this branch, tag or commit as an extra row X (no merge, no Pages)
        type: string
        default: ""
      extra_repo:
        description: Repository of extra_ref (default this repository)
        type: string
        default: ""

permissions:
  contents: read

# One run per branch (and extra ref) at a time; a newer pending run replaces an older pending one.
concurrency:
  group: zi-driver-${{ github.ref }}-${{ inputs.extra_ref }}
  cancel-in-progress: false

env:
  R1_REPO: ElStabilini/qibolab
  R1_REF: zi_drivers
  R2_REPO: sensebat/qibolab
  R2_REF: orkun/26.10
  SUITE_REPO: sensebat/qibolab
  SUITE_REF: orkun/ci
  PROTO_PREFIX: orkun/proto-
  STATE_URL: https://sensebat.github.io/qibolab/state.json

jobs:
  changes:
    name: Commits, laboneq versions, run or skip
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.decide.outputs.run }}
      deploy: ${{ steps.decide.outputs.deploy }}
      key: ${{ steps.decide.outputs.key }}
      r1_sha: ${{ steps.decide.outputs.r1_sha }}
      r2_sha: ${{ steps.decide.outputs.r2_sha }}
      r2_ref: ${{ steps.decide.outputs.r2_ref }}
      ci_sha: ${{ steps.decide.outputs.ci_sha }}
      scripts_sha: ${{ steps.decide.outputs.scripts_sha }}
      extra_repo: ${{ steps.decide.outputs.extra_repo }}
      extra_ref: ${{ steps.decide.outputs.extra_ref }}
      extra_sha: ${{ steps.decide.outputs.extra_sha }}
      pinned: ${{ steps.decide.outputs.pinned }}
      latest: ${{ steps.decide.outputs.latest }}
      matrix: ${{ steps.decide.outputs.matrix }}
    steps:
      # Driver branches (orkun/26.10, pull requests against it, orkun/proto-*) use the ci
      # scripts of orkun/ci.
      - name: Check out the ci scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ (github.ref_name == env.R2_REF || github.base_ref == env.R2_REF || startsWith(github.ref_name, env.PROTO_PREFIX)) && env.SUITE_REF || github.sha }}
          sparse-checkout: ci
          persist-credentials: false

      - name: Resolve and decide
        id: decide
        env:
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          ONLY_IF_CHANGED: ${{ inputs.only_if_changed || false }}
          EXTRA_REF_IN: ${{ inputs.extra_ref }}
          EXTRA_REPO_IN: ${{ inputs.extra_repo }}
        run: bash ci/changes.sh

  # A skipped run gets one placeholder cell (skip: true) that only prints why; a job skipped
  # by `if` would show its unexpanded name "matrix.name".
  cell:
    name: ${{ matrix.name }}
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.matrix) }}
    env:
      ROW: ${{ matrix.row }}
      COL: ${{ matrix.col }}
      R1_SHA: ${{ needs.changes.outputs.r1_sha }}
      R2_REF: ${{ needs.changes.outputs.r2_ref }}
      EXTRA_REPO: ${{ needs.changes.outputs.extra_repo }}
      EXTRA_REF: ${{ needs.changes.outputs.extra_ref }}
      LABONEQ_PINNED: ${{ needs.changes.outputs.pinned }}
      LABONEQ_LATEST: ${{ needs.changes.outputs.latest }}
    steps:
      - name: Nothing changed since the published report
        if: matrix.skip
        run: echo "Commits and newest laboneq equal the published state.json; nothing to test."

      # Without repo and sha the checkout below would take this run's own commit and test it
      # under the row's label. That happens when ci/changes.sh (from scripts_sha) is older
      # than this workflow file, e.g. an orkun/proto-* push while orkun/ci is older.
      - name: Check the cell plan
        if: ${{ !matrix.skip }}
        env:
          CELL_REPO: ${{ matrix.repo }}
          CELL_SHA: ${{ matrix.sha }}
        run: |
          if [ -z "$CELL_REPO" ] || [ -z "$CELL_SHA" ]; then
            echo "::error::cell plan without repo or commit: ci/changes.sh does not match this workflow file (orkun/ci older than ci-rc1?)"
            exit 1
          fi

      - name: Check out the row's code
        if: ${{ !matrix.skip }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ matrix.repo }}
          ref: ${{ matrix.sha }}
          path: driver
          # The R2 merge needs history.
          fetch-depth: ${{ matrix.depth }}
          persist-credentials: false

      - name: Check out the conformance suite (orkun/ci)
        if: ${{ !matrix.skip }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.changes.outputs.ci_sha }}
          path: suite
          sparse-checkout: tests/instruments/zi/conformance
          persist-credentials: false

      - name: Check out the ci scripts
        if: ${{ !matrix.skip }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.changes.outputs.scripts_sha }}
          path: scripts
          sparse-checkout: ci
          persist-credentials: false

      - name: Install uv and Python 3.13
        if: ${{ !matrix.skip }}
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.13"
          cache-dependency-glob: driver/uv.lock

      # An information cell with failed tests keeps this step red but the job green, so the
      # commit status is not red for it; its check (job "checks") is neutral. A target cell's
      # job fails. "Prevents a job from failing when a step fails."
      # https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax#jobsjob_idstepscontinue-on-error
      - name: Merge (R2), install, set laboneq, test
        if: ${{ !matrix.skip }}
        continue-on-error: ${{ !matrix.target }}
        run: bash scripts/ci/run_cell.sh driver suite "cell-$ROW-$COL"

      - name: Upload the cell results
        if: ${{ always() && !matrix.skip }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cell-${{ matrix.cell }}
          path: cell-${{ matrix.cell }}/
          if-no-files-found: warn

  # One check per cell on this run's commit, with the failed tests as annotations and a job
  # summary. Its own job, so that the write permission never meets the tested code.
  # Permissions: https://github.com/EnricoMi/publish-unit-test-result-action#permissions
  # (checks: write; pull-requests: write only for PR comments, off here). A Dependabot pull
  # request gets a read-only GITHUB_TOKEN unless the workflow raises it with `permissions`:
  # https://docs.github.com/en/code-security/reference/supply-chain-security/troubleshoot-dependabot/dependabot-on-actions
  checks:
    name: "${{ matrix.skip && 'Checks: skipped, nothing changed' || matrix.check }}"
    needs: [changes, cell]
    if: always() && needs.changes.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      checks: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.matrix) }}
    steps:
      - name: Download the cell results
        if: ${{ !matrix.skip }}
        id: download
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cell-${{ matrix.cell }}
          path: cell

      # fail_on "test failures": the check fails when a test fails or errors (a strict xfail
      # that passes counts as failed). No junit.xml (merge conflict, install failure): the
      # check is neutral, "inconclusive".
      # https://github.com/EnricoMi/publish-unit-test-result-action#configuration
      - name: Publish the test results
        if: ${{ !matrix.skip }}
        id: publish
        uses: EnricoMi/publish-unit-test-result-action@da5b7be67623cd59bbbd1a0ce4f022050a55605f # v2.26.0
        with:
          files: cell/junit.xml
          check_name: ${{ matrix.check }}
          comment_mode: "off"
          fail_on: test failures
          action_fail: false

      # Check run conclusions include "neutral" (grey; it does not make the commit status red):
      # https://docs.github.com/en/rest/checks/runs#update-a-check-run
      - name: Keep the check link; information cell, set a failed check to neutral
        if: ${{ !matrix.skip }}
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET: ${{ matrix.target }}
          CONCLUSION: ${{ fromJSON(steps.publish.outputs.json).conclusion }}
          CHECK_URL: ${{ fromJSON(steps.publish.outputs.json).check_url }}
        run: |
          mkdir -p check && echo "$CHECK_URL" > check/url.txt
          echo "check: $CHECK_URL ($CONCLUSION)"
          if [ "$TARGET" != true ] && [ "$CONCLUSION" = failure ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/check-runs/${CHECK_URL##*/}" \
              -f conclusion=neutral --jq '"set to " + .conclusion'
          fi

      - name: Upload the check link
        if: ${{ !matrix.skip }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: check-${{ matrix.cell }}
          path: check/

  report:
    name: Report
    needs: [changes, cell, checks]
    if: always() && needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the report script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.changes.outputs.scripts_sha }}
          sparse-checkout: ci
          persist-credentials: false

      - name: Download the cell results
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: cell-*
          path: cells

      - name: Download the check links
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: check-*
          path: checks

      - name: Build index.html and state.json
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          CHECKS_URL: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}/checks
          KEY: ${{ needs.changes.outputs.key }}
          R1_SHA: ${{ needs.changes.outputs.r1_sha }}
          R2_SHA: ${{ needs.changes.outputs.r2_sha }}
          R2_REF: ${{ needs.changes.outputs.r2_ref }}
          CI_SHA: ${{ needs.changes.outputs.ci_sha }}
          EXTRA_REPO: ${{ needs.changes.outputs.extra_repo }}
          EXTRA_REF: ${{ needs.changes.outputs.extra_ref }}
          EXTRA_SHA: ${{ needs.changes.outputs.extra_sha }}
          LABONEQ_PINNED: ${{ needs.changes.outputs.pinned }}
          LABONEQ_LATEST: ${{ needs.changes.outputs.latest }}
          MATRIX: ${{ needs.changes.outputs.matrix }}
        run: |
          mkdir -p cells checks
          python3 ci/report.py cells report --summary "$GITHUB_STEP_SUMMARY" --checks checks \
            --when "$(date -u '+%Y-%m-%d %H:%M UTC')"

      - name: Upload the report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-report
          path: report/

  # The run's conclusion: success exactly when every target cell of this run is green.
  gate:
    name: Targets green
    needs: [changes, cell, report]
    if: always() && needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the gate script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.changes.outputs.scripts_sha }}
          sparse-checkout: ci
          persist-credentials: false

      - name: Download the report
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: test-report
          path: report

      - name: Check the target cells
        run: python3 ci/gate.py report/state.json

  # Publish at https://sensebat.github.io/qibolab/ (orkun/ci, rows R1 and R2 only), also when a
  # cell is red.
  pages:
    name: Publish to GitHub Pages
    needs: [changes, report]
    if: always() && needs.report.result == 'success' && needs.changes.outputs.deploy == 'true' && github.ref == 'refs/heads/orkun/ci'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Download the report
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: test-report
          path: site

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload the Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
