# ZI driver tests: tests/instruments/zi of the pushed commit (driver tests and the
# conformance suite in tests/instruments/zi/conformance), offline with LabOne Q emulation.
# laboneq is the version in this commit's uv.lock (--locked fails when uv.lock and
# pyproject.toml disagree). Runs on every push to every branch that carries this file, on
# pull requests and by hand (Actions tab or `gh workflow run zi-tests.yml --ref <branch>`).
# Result: check "ZI driver tests" on the commit, with failed tests as annotations, plus a job
# summary (EnricoMi/publish-unit-test-result-action). xfail counts as skipped; a strict xfail
# that passes counts as failed.
name: ZI driver tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  checks: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"
      - run: uv sync --locked --group zi --group tests
      # -o addopts= drops qibolab's coverage options.
      - run: uv run --no-sync pytest tests/instruments/zi -o addopts= --junitxml=junit.xml
      - uses: EnricoMi/publish-unit-test-result-action@da5b7be67623cd59bbbd1a0ce4f022050a55605f # v2.26.0
        if: ${{ !cancelled() }}
        with:
          files: junit.xml
          check_name: ZI driver tests
          comment_mode: off
